# GENERATED by src/soft_arm/generate_scenes.py from src/soft_arm/params.py.
# Do not edit by hand: regenerate, and a test asserts byte-equality.
# Hardened variant of soft_arm/<rung>_collision.yaml: `binF` removed.
# Four shelves, two tables, at the same welds as the rigid arms' scenes, so the
# shelf compartment table and the containment predicate apply unchanged.
directives:

# The soft arm. Welded at the ORIGIN with no X_PC -- CalibrateFlowFrame compares a
# world-frame scene pose against a base-frame flow pose and needs the offset to be
# constant, which holds only at the origin.
  - add_model:
      name: soft9
      file: package://combining_kinematics/models/soft_arm/soft9.sdf

  - add_weld:
      parent: world
      child: soft9::base

# The same finray gripper the iiwa carries, so `between_fingers` and the
# 0.100 m wrist-to-fingertip separation are literally the same geometry.
  - add_model:
      name: finray
      file: package://combining_kinematics/models/wsg_finray/wsg50_110_finray_fingers_box_collision.sdf

  - add_weld:
      parent: soft9::soft_tip
      child: finray::hand
      X_PC:
        rotation: !Rpy { deg: [90.0, 0.0, 0.0] }

# The gripper sits inside the tip sphere by construction, so it is filtered
# against the last segment. It is NOT filtered against the rest of the arm: a
# soft arm can curl its gripper into its own body, and that is a real constraint.
  - add_collision_filter_group:
      name: gripper_and_tip
      members:
        - finray::hand
        - finray::left_finger
        - finray::right_finger
        - soft9::seg2_sub0
        - soft9::seg2_sub1
        - soft9::seg2_sub2
        - soft9::seg2_sub3
        - soft9::seg2_sub4
        - soft9::seg2_sub5
        - soft9::seg2_sub6
        - soft9::seg2_sub7
        - soft9::seg2_sub8
        - soft9::seg2_sub9
        - soft9::soft_tip_link
      ignored_collision_filter_groups: [gripper_and_tip]

  - add_model:
      name: table
      file: package://drake_models/manipulation_station/table_wide.sdf

  - add_weld:
      parent: world
      child: table::table_body
      X_PC:
        translation: [0.4, 0.0, 0.0]

  - add_model:
      name: table2
      file: package://drake_models/manipulation_station/table_wide.sdf

  - add_weld:
      parent: world
      child: table2::table_body
      X_PC:
        translation: [-0.2, 0.0, 0.0]

  - add_model:
      name: shelves
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves::shelves_body
      X_PC:
        translation: [0.3, 0.55, 0.4]
        rotation: !Rpy { deg: [0.0, 0.0, 235.0] }

  - add_model:
      name: shelves2
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves2::shelves_body
      X_PC:
        translation: [0.3, -0.55, 0.4]
        rotation: !Rpy { deg: [0.0, 0.0, 135.0] }

  - add_model:
      name: shelves3
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves3::shelves_body
      X_PC:
        translation: [-0.45, -0.55, 0.4]
        rotation: !Rpy { deg: [0.0, 0.0, 235.0] }

  - add_model:
      name: shelves4
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves4::shelves_body
      X_PC:
        translation: [-0.45, 0.55, 0.4]
        rotation: !Rpy { deg: [0.0, 0.0, 135.0] }

# The arm is mounted THROUGH the table surface, which sits at z = 0, so its first
# collision sphere is centred inside the table. The rigid arms get this for free:
# their base link is welded, and Drake never generates collision candidates between
# two ANCHORED geometries. The soft arm's sub-links are floating bodies, so the pair
# IS generated, and every uniformly drawn configuration was rejected on collision
# before containment was even consulted -- 50001 of 50001 draws, measured. Filtering
# the first sphere against the two tables is the same statement a welded base makes.
#
# The alternative -- raising the backbone on a mount -- was built and measured, and
# rejected: it would have given this robot a different base height from the rigid
# arms, and a mismatch in setup across experiments is a landmine for comparability
# even when the geometry is reasonable (Thomas, 2026-09-24).
#
# Deliberately only the spheres whose centres sit within one collision radius of
# z = 0 -- derived from the spec, not hardcoded, so changing K or the radius cannot
# leave one unfiltered. The rest of the arm must not pass through a table.
  - add_collision_filter_group:
      name: arm_base_and_tables
      members:
        - soft9::seg0_sub0
        - soft9::seg0_sub1
        - table::table_body
        - table2::table_body
      ignored_collision_filter_groups: [arm_base_and_tables]
