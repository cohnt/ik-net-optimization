# GENERATED by src/mobile_base/generate_scenes.py. Do not edit: a test asserts
# byte-equality. The mobile-base scene: the arm block of
# models/soft12/soft12_collision_hardened.yaml
# on the KMR-style platform, in ../codebase's Basic Mobile Manipulator room.
directives:

# The planar base (world -> x -> y -> yaw) and its platform box.
  - add_model:
      name: mobile_base
      file: package://combining_kinematics/models/mobile_base/kmr_platform.urdf
      default_joint_positions:
        platform_x: [1.5]
        platform_y: [0.0]
        platform_yaw: [0.0]

# The arm block, lifted from the hardened scene; only its base weld moved.

# The soft arm. Welded at the ORIGIN with no X_PC -- CalibrateFlowFrame compares a
# world-frame scene pose against a base-frame flow pose and needs the offset to be
# constant, which holds only at the origin.
  - add_model:
      name: soft12
      file: package://combining_kinematics/models/soft12/soft12.sdf

  - add_weld:
      parent: mobile_base::kmriiwa_mount_frame
      child: soft12::base

# The same finray gripper the iiwa carries, so `between_fingers` and the
# 0.100 m wrist-to-fingertip separation are literally the same geometry.
  - add_model:
      name: finray
      file: package://combining_kinematics/models/wsg_finray/wsg50_110_finray_fingers_box_collision.sdf

  - add_weld:
      parent: soft12::soft_tip
      child: finray::hand
      X_PC:
        rotation: !Rpy { deg: [90.0, 0.0, 0.0] }

# The gripper sits inside the tip sphere by construction, so it is filtered
# against the last segment. It is NOT filtered against the rest of the arm: a
# soft arm can curl its gripper into its own body, and that is a real constraint.
  - add_collision_filter_group:
      name: gripper_and_tip
      members:
        - finray::hand
        - finray::left_finger
        - finray::right_finger
        - soft12::seg3_sub0
        - soft12::seg3_sub1
        - soft12::seg3_sub2
        - soft12::seg3_sub3
        - soft12::seg3_sub4
        - soft12::seg3_sub5
        - soft12::seg3_sub6
        - soft12::seg3_sub7
        - soft12::soft_tip_link
      ignored_collision_filter_groups: [gripper_and_tip]

# ../codebase's room: a central table, four shelf units standing on it.
  - add_model:
      name: table
      file: package://combining_kinematics/models/mobile_base/central_table.sdf

  - add_weld:
      parent: world
      child: table::table_body
      X_PC:
        translation: [0.0, 0.0, 0.996706]

  - add_model:
      name: shelves
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves::shelves_body
      X_PC:
        translation: [0.85, 0.0, 1.396706]
        rotation: !Rpy { deg: [0.0, 0.0, -180.0] }

  - add_model:
      name: shelves2
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves2::shelves_body
      X_PC:
        translation: [0.0, 0.85, 1.396706]
        rotation: !Rpy { deg: [0.0, 0.0, -90.0] }

  - add_model:
      name: shelves3
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves3::shelves_body
      X_PC:
        translation: [-0.85, 0.0, 1.396706]
        rotation: !Rpy { deg: [0.0, 0.0, 0.0] }

  - add_model:
      name: shelves4
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves4::shelves_body
      X_PC:
        translation: [0.0, -0.85, 1.396706]
        rotation: !Rpy { deg: [0.0, 0.0, 90.0] }

# The arm's base is bolted to the platform: the one filter, on every robot. On the
# soft PCS arm it also covers the sub-link spheres its hardened scene filters
# against the tables it was mounted through.
  - add_collision_filter_group:
      name: arm_base_and_platform
      members:
        - mobile_base::kmriiwa_base_link
        - soft12::base
        - soft12::seg0_sub0
        - soft12::seg0_sub1
      ignored_collision_filter_groups: [arm_base_and_platform]
