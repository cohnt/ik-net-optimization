# GENERATED by src/mobile_base/generate_scenes.py. Do not edit: a test asserts
# byte-equality. The mobile-base scene: the arm block of
# models/iiwa14/iiwa14_collision_hardened.yaml
# on the KMR-style platform, in ../codebase's Basic Mobile Manipulator room.
directives:

# The planar base (world -> x -> y -> yaw) and its platform box.
  - add_model:
      name: mobile_base
      file: package://combining_kinematics/models/mobile_base/kmr_platform.urdf
      default_joint_positions:
        platform_x: [1.5]
        platform_y: [0.0]
        platform_yaw: [0.0]

# The arm block, lifted from the hardened scene; only its base weld moved.

# Add iiwa
  - add_model:
      name: iiwa
      file: package://combining_kinematics/models/iiwa14/iiwa14_spheres_cylinders_collision.urdf
      default_joint_positions:
        iiwa_joint_1: [0]
        iiwa_joint_2: [0.3]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.8]
        iiwa_joint_5: [0]
        iiwa_joint_6: [1]
        iiwa_joint_7: [1.57]

  - add_weld:
      parent: mobile_base::kmriiwa_mount_frame
      child: iiwa::base

  - add_model:
      name: finray
      file: package://combining_kinematics/models/wsg_finray/wsg50_110_finray_fingers_box_collision.sdf
      # default_joint_positions:
      # left_finger_sliding_joint: [-0.03]
      # right_finger_sliding_joint: [0.03]

  - add_weld:
      parent: iiwa::iiwa_link_7
      child: finray::hand
      X_PC:
        translation: [0, 0, 0.084]
        rotation: !Rpy { deg: [90, 0, 90] }

# ../codebase's room: a central table, four shelf units standing on it.
  - add_model:
      name: table
      file: package://combining_kinematics/models/mobile_base/central_table.sdf

  - add_weld:
      parent: world
      child: table::table_body
      X_PC:
        translation: [0.0, 0.0, 0.996706]

  - add_model:
      name: shelves
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves::shelves_body
      X_PC:
        translation: [0.85, 0.0, 1.396706]
        rotation: !Rpy { deg: [0.0, 0.0, -180.0] }

  - add_model:
      name: shelves2
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves2::shelves_body
      X_PC:
        translation: [0.0, 0.85, 1.396706]
        rotation: !Rpy { deg: [0.0, 0.0, -90.0] }

  - add_model:
      name: shelves3
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves3::shelves_body
      X_PC:
        translation: [-0.85, 0.0, 1.396706]
        rotation: !Rpy { deg: [0.0, 0.0, 0.0] }

  - add_model:
      name: shelves4
      file: package://combining_kinematics/models/assets/shelves.sdf

  - add_weld:
      parent: world
      child: shelves4::shelves_body
      X_PC:
        translation: [0.0, -0.85, 1.396706]
        rotation: !Rpy { deg: [0.0, 0.0, 90.0] }

# The arm's base is bolted to the platform: the one filter, on every robot. On the
# soft PCS arm it also covers the sub-link spheres its hardened scene filters
# against the tables it was mounted through.
  - add_collision_filter_group:
      name: arm_base_and_platform
      members:
        - mobile_base::kmriiwa_base_link
        - iiwa::base
      ignored_collision_filter_groups: [arm_base_and_platform]
